<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Opening Your CoverageFit Snapshot</title>
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/assets/images/coveragefit-mark.svg" />
    <link rel="stylesheet" href="/assets/css/pvx-experience-foundation.css" />
    <link rel="stylesheet" href="/assets/css/pvx-host-aware.css" />
    <link rel="stylesheet" href="/assets/css/pvx-clarity-1.3.css" />
  </head>
  <body data-pvx-web-bootstrap>
    <main class="pvx-main" id="pvxWebBootstrapMain" tabindex="-1">
      <section class="pvx-shell pvx-web-bootstrap" aria-labelledby="pvxWebBootstrapTitle">
        <img class="pvx-clarity-logo" src="/assets/images/coveragefit-logo-board.png" width="320" height="96" alt="CoverageFit" />
        <span class="pvx-kicker">Connected from Virginia Tam Insurance Agency</span>
        <h1 id="pvxWebBootstrapTitle">Opening your Snapshot.</h1>
        <p id="pvxWebBootstrapStatus" role="status" aria-live="polite">Connecting your review…</p>
        <noscript><p>JavaScript is needed for this secure handoff. <a href="/pvx/start/">Start CoverageFit directly</a>.</p></noscript>
        <p id="pvxWebBootstrapFallback" hidden>This secure return is unavailable. <a href="/pvx/start/">Start a new CoverageFit Snapshot</a>.</p>
      </section>
    </main>
    <script src="/assets/js/pvx-consumer-events.js"></script>
    <script src="/assets/js/pvx-host-aware.js"></script>
    <script src="/assets/js/pvx-web-bootstrap.js"></script>
  </body>
</html>
